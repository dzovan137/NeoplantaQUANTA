# Build the MyST site and publish it to GitHub Pages.
# Created following https://mystmd.org/guide/deployment-github-pages
name: MyST GitHub Pages Deploy
on:
  push:
    branches: [main]      # deploy whenever you push to main
env:
  # Served from https://<user>.github.io/<repo>, so assets need the repo name as base path.
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install MyST Markdown
        run: npm install -g mystmd
      - name: Build HTML Assets
        run: myst build --html
      - name: Keep the site out of search engines (noindex)
        run: |
          # Inject a noindex directive into the <head> of every generated page so
          # Google/Bing crawl the page, see the tag, and drop it from search results.
          find _build/html -name '*.html' -print0 \
            | xargs -0 sed -i 's#</head>#<meta name="robots" content="noindex, nofollow"></head>#'
          # Stop advertising pages to crawlers: remove the auto-generated sitemap.
          rm -f _build/html/sitemap.xml _build/html/sitemap_style.xsl
          # robots.txt must still ALLOW crawling — otherwise bots never fetch the
          # page and never see the noindex tag above. No sitemap reference.
          printf 'User-agent: *\nAllow: /\n' > _build/html/robots.txt
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
