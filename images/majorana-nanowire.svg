<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Schema poluprovodnicke nanozice na superprovodniku sa Majorana modovima na krajevima">
  <rect x="0" y="0" width="480" height="200" rx="10" fill="#F4F4F1" stroke="#D3D1C7" stroke-width="1"/>

  <!-- magnetic field -->
  <line x1="70" y1="40" x2="410" y2="40" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M410 40 l-8 -4 v8 z" fill="#888780"/>
  <text x="416" y="44" font-family="sans-serif" font-size="12" fill="#5F5E5A">B</text>

  <!-- superconductor slab -->
  <rect x="60" y="128" width="360" height="36" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="1"/>
  <text x="240" y="151" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0C447C">superprovodnik</text>

  <!-- semiconductor nanowire -->
  <rect x="88" y="104" width="304" height="18" rx="9" fill="#F0997B" stroke="#D85A30" stroke-width="1"/>
  <text x="240" y="96" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#993C1D">poluprovodnička nanožica</text>

  <!-- Majorana zero modes at the ends -->
  <circle cx="92" cy="113" r="12" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.5"/>
  <circle cx="388" cy="113" r="12" fill="#AFA9EC" stroke="#534AB7" stroke-width="1.5"/>
  <text x="92" y="117" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#26215C">&#947;&#8321;</text>
  <text x="388" y="117" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#26215C">&#947;&#8322;</text>

  <text x="240" y="188" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#5F5E5A">Majorana modovi (&#947;&#8321;, &#947;&#8322;) na krajevima žice</text>
</svg>
