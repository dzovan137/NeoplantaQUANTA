# MyST / Jupyter Book 2 configuration
# Docs: https://mystmd.org/guide/frontmatter  and  https://next.jupyterbook.org
version: 1
project:
  id: intro-quantum-information
  title: O ovom kursu
  description: Kratak i interaktivni kurs. 
  keywords:
    - quantum information
    - qubits
    - quantum computing
    - lecture notes
  authors:
    - name: NeoplantaQUANTA
      # email: you@example.com
      #affiliations:
      #  - Univerzitet u Novom Sadu, Prirodno-matematički fakultet, Departman za fiziku
  github: https://github.com/dzovan137/NeoplantaQUANTA
  license:
    content: CC-BY-4.0
    code: MIT
  bibliography:
    - references.bib

  # Reusable LaTeX macros — available in every page.
  # These make Dirac notation painless: write \ket{0}, \bra{\psi}, \braket{\phi}{\psi}.
  math:
    '\ket': '\left|#1\right\rangle'
    '\bra': '\left\langle#1\right|'
    '\braket': '\left\langle#1\middle|#2\right\rangle'
    '\dyad': '\left|#1\right\rangle\!\left\langle#2\right|'
    '\Hilb': '\mathcal{H}'
    '\CC': '\mathbb{C}'
    '\Tr': '\operatorname{Tr}'

  # --- Serbian numbering labels ---------------------------------------------
  # Controls CROSS-REFERENCES: writing "...na slici [](#fig:bloch)" renders the
  # link as "Slika 1" (and "Tabela 1" for tables) instead of "Figure 1".
  # NOTE: the caption PREFIXES that appear above/below the image ("Slika 1:")
  # are set by the plugin below — MyST hardcodes the caption word, so this
  # numbering template alone does not reach it.
  numbering:
    figure:
      template: Slika %s
    subfigure:
      template: Slika %s
    table:
      template: Tabela %s

  # Local transform plugin that rewrites the figure/table caption prefixes to
  # Serbian ("Figure 1:" -> "Slika 1:", "Table 1:" -> "Tabela 1:") on every
  # page — existing and any new lecture you add later.
  plugins:
    - type: javascript
      path: serbian-labels.mjs

  # Table of contents (order of pages in the left sidebar).
  toc:
    - file: intro.md
    - title: Poglavlje 1 
      children:
        - file: poglavlje1/00-introduction.md
        - file: poglavlje1/01-who.md
        - file: poglavlje1/02-qubits.md
    - title: Poglavlje 2
      children:
        - file: poglavlje2/03-one-qubit-gates.md
        - file: poglavlje2/04-circuits.md
        - file: poglavlje2/05-measurements.md
        - file: poglavlje2/06-real_quantum_computer.md
        - file: poglavlje2/07-using_quantum_computer.md
    - title: Poglavlje 3
      children:
        - file: poglavlje3/08-multiqubit.md
        - file: poglavlje3/09-multiqubit_measurement.md
        - file: poglavlje3/10-entanglement.md
        - file: poglavlje3/11-teleportation.md
    - title: Poglavlje 4
      children:
        - file: poglavlje4/bell-inquality.md

    - title: Reference
      children:
        - file: mogucnosti/feature-gallery.md

site:
  template: book-theme
  title: Uvod 
  options:
    logo: images/header-logo.png
    logo_alt: Prirodno-matematički fakultet i Departman za fiziku
    logo_text: Uvod u kvantnu informatiku
    style: styles/site.css
    # A few book-theme niceties:
    hide_outline: false
    hide_toc: false
  nav:
    - title: GitHub
      url: https://github.com/dzovan137/NeoplantaQUANTA
