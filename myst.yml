# MyST / Jupyter Book 2 configuration
# Docs: https://mystmd.org/guide/frontmatter  and  https://next.jupyterbook.org
version: 1
project:
  id: intro-quantum-information
  title: Introduction to Quantum Information
  description: A short, interactive introduction to the basics of quantum information.
  keywords:
    - quantum information
    - qubits
    - quantum computing
    - lecture notes
  authors:
    - name: Jovan Odavić
      # email: you@example.com
      # affiliations:
      #   - Your University
  github: https://github.com/dzovan137/NeoplantaQUANTA
  license:
    content: CC-BY-4.0
    code: MIT
  bibliography:
    - references.bib

  # Full-course PDF (all pages combined) — offered as a download on every page.
  exports:
    - format: pdf
      template: https://github.com/myst-templates/plain_typst_book
      output: exports/neoplanta-quanta.pdf
      id: pdf-book

  # Reusable LaTeX macros — available in every page.
  # These make Dirac notation painless: write \ket{0}, \bra{\psi}, \braket{\phi}{\psi}.
  math:
    '\ket': '\left|#1\right\rangle'
    '\bra': '\left\langle#1\right|'
    '\braket': '\left\langle#1\middle|#2\right\rangle'
    '\dyad': '\left|#1\right\rangle\!\left\langle#2\right|'
    '\Hilb': '\mathcal{H}'
    '\CC': '\mathbb{C}'

  # Table of contents (order of pages in the left sidebar).
  toc:
    - file: intro.md
    - title: Lessons
      children:
        - file: content/01-qubits.md
    - title: Reference
      children:
        - file: content/02-feature-gallery.md

site:
  template: book-theme
  title: Introduction to Quantum Information
  options:
    logo_text: Intro to QI
    # A few book-theme niceties:
    hide_outline: false
    hide_toc: false
  nav:
    - title: GitHub
      url: https://github.com/dzovan137/NeoplantaQUANTA
